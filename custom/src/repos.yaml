---
odoo:
  defaults:
    depth: ${WAFT_DEPTH_DEFAULT}
  remotes:
    origin: https://github.com/odoo/odoo.git
  target: origin ${ODOO_VERSION}
  merges:
    - origin ${ODOO_VERSION}

agrios:
  defaults:
    depth: ${WAFT_DEPTH_MERGE}
  remotes:
    origin: git@github.com:advanceinsight/AgriOS
  target: origin ${ODOO_VERSION}
  merges:
    - origin ${ODOO_VERSION}
    - origin 18.0-lgpl

OCA/account-financial-tools:
  defaults:
    depth: ${WAFT_DEPTH_DEFAULT}
  remotes:
    origin: https://github.com/OCA/account-financial-tools.git
  target: origin ${ODOO_VERSION}
  merges:
    - origin ${ODOO_VERSION}

