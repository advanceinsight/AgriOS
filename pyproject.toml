[build-system]
# we use hatch: https://hatch.pypa.io/latest/config/build/#build-system
# we also use the hatch-odoo build backend which knows how to detect dependencies
# from Odoo addons manifests
requires = ["hatchling", "hatch-odoo"]
build-backend = "hatchling.build"

[project]
# The standard project metadata section
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
name = "agrios"
version = "18.0"
description = "AgriOS"
readme = "README.md"
requires-python = "==3.12.*"
# Dependencies are dynamic because they will be generated from Odoo addons manifests.
dynamic = ["dependencies"]

[tool.hatch.build]
# Exclude agrios_kobo, because it depends on a private module which cannot be found
# on a public VCS and would raise a dependency error.
exclude = ["agrios_kobo"]
include = ["./"]

# Enable the hatch-odoo metadata hook to generate dependencies from addons manifests.
[tool.hatch.metadata.hooks.odoo-addons-dependencies]
# Enable the hatch-odoo build hook to locate the Odoo addons and package them in odoo/addons.
# if not provided, "locals" modules (those in './') are not found and cannot be installed...
[tool.hatch.build.hooks.odoo-addons-dirs]

[tool.hatch-odoo]
# in case of some module not following OCA standard way for their version, force the 18.0 prefix
odoo_version_override = "18.0"

# directories to traverse
addons_dirs = ["./"]

# dependencies that are not in the addons manifest
dependencies = [
  "odoo==18.0.*",
  # Add some constraints to Odoo deps that should be in their setup.py
  "asn1crypto==1.5.1",
  "Babel==2.10.3",
  "cbor2==5.6.2",
  "chardet==5.2.0",
  "cryptography==42.0.8",
  "decorator==5.1.1",
  "docutils==0.20.1",
  "freezegun==1.2.1",
  "geoip2==2.9.0",
  "gevent==24.2.1",
  "greenlet==3.0.3",
  "idna==3.6",
  "Jinja2==3.1.2",
  "libsass==0.22.0",
  "lxml==5.2.1",
  "lxml-html-clean",
  "MarkupSafe==2.1.5",
  "num2words==0.5.13",
  "ofxparse==0.21",
  "openpyxl==3.1.2",
  "passlib==1.7.4",
  "pdfminer.six==20211012",
  "Pillow==10.2.0",
  "polib==1.1.1",
  "psutil==5.9.8",
  "psycopg2==2.9.9",
  "pyopenssl==24.1.0",
  "PyPDF2==2.12.1",
  "pyserial==3.5",
  "python-dateutil==2.8.2",
  "python-ldap==3.4.4",
  "python-stdnum==1.19",
  "pytz",
  "pyusb==1.2.1",
  "qrcode==7.4.2",
  "reportlab==4.1.0",
  "requests==2.31.0",
  "rjsmin==1.2.0",
  "urllib3==2.0.7",
  "vobject==0.9.6.1",
  "Werkzeug==3.0.1",
  "xlrd==2.0.1",
  "XlsxWriter==3.1.9",
  "xlwt==1.3.0",
  "zeep==4.2.1",
]

[tool.uv]
# tell uv when dependencies may change
cache-keys = [{ file = "pyproject.toml" }, { file = "**/__manifest__.py" }]

[dependency-groups]
dev = [
  "parameterized>=0.9.0",
  "pytest>8",
  "pytest-odoo==2.1.2",
  "pytest-cov>=5.0.0",
  "pytest-xdist>=3.6.1",
  "manifestoo>=1.0",
  "odoo-test-helper",
  "websocket-client",
]

[tool.uv.sources]
# by default, packages are taken from PyPI, unless overridden here
odoo = { git = "https://github.com/odoo/odoo", branch = "18.0" }
odoo-addon-geospatial-plot =  { git = "https://github.com/OCA/geospatial", rev = "refs/pull/429/head", subdirectory = "geospatial_plot" }

[tool.pytest]
addopts = "-v -s --cov-report term-missing"
